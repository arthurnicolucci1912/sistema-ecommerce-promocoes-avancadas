spring:
  application:
    name: ecommerce
  jackson:
    deserialization:
      # Identificadores, versoes e quantidades inteiras nao podem truncar valores fracionarios.
      accept-float-as-int: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  jwt:
    # Sem valor padrao: fora do perfil dev a aplicacao nao sobe sem APP_JWT_SECRET.
    # O default vazio faz a validacao (@NotBlank) falhar, em vez de manter o texto "${APP_JWT_SECRET}".
    segredo: ${APP_JWT_SECRET:}
    expiracao: 60m

# Politica de conflito entre promocoes (Strategy PoliticaConflito, usada pelo MotorDePromocoes):
#   padrao         (default) regra D4: exclusiva de maior desconto, ou acumulaveis + melhor nao acumulavel.
#   maior-desconto aplica somente a promocao elegivel de maior desconto (PoliticaSomenteMaiorDesconto).
# Sem a propriedade vale "padrao". Valor desconhecido impede a subida (nenhuma politica registrada).
# ecommerce:
#   promocoes:
#     politica-conflito: padrao

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
